name: Compilar APK ThunderAI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34'
          api-level: 34
      
      - name: Preparar gradlew
        run: |
          # Mostrar archivos para depuración
          echo "=== Archivos en la raíz ==="
          ls -la
          
          # Buscar gradlew
          if [ -f gradlew ]; then
            # Convertir a formato Unix
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            echo "✅ gradlew listo para ejecutar"
          else
            echo "❌ Error: gradlew no encontrado"
            echo "Buscando en todo el repositorio..."
            find . -name "gradlew" -type f
            exit 1
          fi
      
      - name: Cache de Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
      
      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      
      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30