name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Crear directorio wrapper
        run: mkdir -p gradle/wrapper
      
      - name: Descargar Gradle Wrapper JAR
        run: |
          echo "Descargando gradle-wrapper.jar..."
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
          
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ gradle-wrapper.jar descargado correctamente"
            ls -la gradle/wrapper/
          else
            echo "❌ Error al descargar gradle-wrapper.jar"
            exit 1
          fi
      
      - name: Verificar gradle-wrapper.properties
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Creando gradle-wrapper.properties..."
            cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi
          echo "Contenido de gradle-wrapper.properties:"
          cat gradle/wrapper/gradle-wrapper.properties
      
      - name: Descargar y configurar Gradle
        run: |
          # Si no existe gradlew, crear uno básico
          if [ ! -f "gradlew" ]; then
            echo "Creando script gradlew..."
            cat > gradlew << 'EOF'
          #!/bin/sh
          #
          # Gradle start up script for POSIX generated by Gradle.
          #
          
          # Attempt to set APP_HOME
          PRG="$0"
          while [ -h "$PRG" ] ; do
              ls=`ls -ld "$PRG"`
              link=`expr "$ls" : '.*-> \(.*\)$'`
              if expr "$link" : '/.*' > /dev/null; then
                  PRG="$link"
              else
                  PRG=`dirname "$PRG"`"/$link"
              fi
          done
          SAVED="`pwd`"
          cd "`dirname \"$PRG\"`/" >/dev/null
          APP_HOME="`pwd -P`"
          cd "$SAVED" >/dev/null
          
          APP_NAME="Gradle"
          APP_BASE_NAME=`basename "$0"`
          
          DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'
          
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          
          exec java $DEFAULT_JVM_OPTS $JAVA_OPTS -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          fi
          
          chmod +x gradlew
          echo "✅ gradlew configurado correctamente"
      
      - name: Verificar estructura completa
        run: |
          echo "=== Estructura del proyecto ==="
          ls -la
          echo ""
          echo "=== Gradle Wrapper ==="
          ls -la gradle/wrapper/
          echo ""
          echo "=== Permisos gradlew ==="
          ls -la gradlew
          echo ""
          echo "=== Java version ==="
          java -version
      
      - name: Compilar APK Debug
        run: |
          echo "Iniciando compilación debug..."
          ./gradlew assembleDebug --stacktrace --no-daemon
      
      - name: Verificar APK generado
        run: |
          echo "=== Buscando APK generado ==="
          find . -name "*.apk" -type f
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK Debug generado correctamente"
            ls -la app/build/outputs/apk/debug/
          else
            echo "❌ APK Debug no encontrado"
            echo "Buscando en otras ubicaciones..."
            find app/build -name "*.apk" -type f
            exit 1
          fi
      
      - name: Subir APK Debug como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SGC-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          compression-level: 6
      
      - name: Mostrar información del build
        run: |
          echo "========================================="
          echo "  COMPILACIÓN COMPLETADA EXITOSAMENTE"
          echo "========================================="
          echo "Fecha: $(date)"
          echo "Build type: Debug"
          echo "APK: app/build/outputs/apk/debug/app-debug.apk"
          echo "Tamaño: $(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')"
          echo "========================================="