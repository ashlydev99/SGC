name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nombre de versión (ej: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Código de versión (número entero)'
        required: true
        default: '1'

jobs:
  build:
    name: Compilar APK Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Actualizar versión
        run: |
          echo "Actualizando versión a ${{ github.event.inputs.version_name }} (${{ github.event.inputs.version_code }})"
          # Actualizar el archivo build.gradle.kts con la nueva versión
          sed -i "s/versionName = \".*\"/versionName = \"${{ github.event.inputs.version_name }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${{ github.event.inputs.version_code }}/" app/build.gradle.kts
      
      - name: Hacer ejecutable gradlew
        run: chmod +x gradlew
      
      - name: Descargar Gradle Wrapper JAR
        run: |
          GRADLE_VERSION="8.5"
          WRAPPER_DIR="gradle/wrapper"
          mkdir -p $WRAPPER_DIR
          
          echo "Descargando gradle-wrapper.jar versión $GRADLE_VERSION..."
          curl -L -o $WRAPPER_DIR/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v$GRADLE_VERSION/gradle/wrapper/gradle-wrapper.jar"
          
          echo "Verificando descarga..."
          if [ -f "$WRAPPER_DIR/gradle-wrapper.jar" ]; then
            echo "✅ gradle-wrapper.jar descargado correctamente"
            ls -la $WRAPPER_DIR/gradle-wrapper.jar
          else
            echo "❌ Error al descargar gradle-wrapper.jar"
            exit 1
          fi
      
      - name: Generar keystore para firma
        run: |
          keytool -genkey -v \
            -keystore app/release.keystore \
            -alias sgc-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=SGC, OU=Dev, O=SGC System, L=Habana, ST=Habana, C=CU"
      
      - name: Compilar APK Release
        run: |
          echo "Iniciando compilación release..."
          ./gradlew assembleRelease --stacktrace
      
      - name: Verificar APK generado
        run: |
          echo "=== Buscando APK generado ==="
          find app/build -name "*.apk" -type f
          
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ APK Release generado correctamente"
            ls -la app/build/outputs/apk/release/
          else
            echo "❌ APK Release no encontrado"
            exit 1
          fi
      
      - name: Subir APK Release como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SGC-Release-APK-v${{ github.event.inputs.version_name }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          compression-level: 9
      
      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          name: Release v${{ github.event.inputs.version_name }}
          body: |
            ## 🚀 SGC v${{ github.event.inputs.version_name }}
            
            ### 📱 APK Release
            - Versión: ${{ github.event.inputs.version_name }}
            - Código: ${{ github.event.inputs.version_code }}
            - Fecha: $(date +%Y-%m-%d)
            
            ### 📝 Cambios
            - Compilación automática desde GitHub Actions
            
            ### 📥 Instalación
            Descargar el archivo APK e instalar en dispositivo Android 7.0+
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Mostrar información del build
        run: |
          echo "========================================="
          echo "  COMPILACIÓN COMPLETADA EXITOSAMENTE"
          echo "========================================="
          echo "Fecha: $(date)"
          echo "Build type: Release"
          echo "Versión: ${{ github.event.inputs.version_name }}"
          echo "Código: ${{ github.event.inputs.version_code }}"
          echo "APK: app/build/outputs/apk/release/app-release.apk"
          echo "========================================="