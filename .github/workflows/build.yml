name: Compilar APK ThunderAI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔧 Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'
      
      - name: 🔍 Verificar archivos esenciales
        run: |
          echo "=== Verificando archivos del proyecto ==="
          
          # Verificar settings.gradle.kts
          if [ -f "settings.gradle.kts" ]; then
            echo "✅ settings.gradle.kts"
          else
            echo "❌ ERROR: settings.gradle.kts no encontrado"
            exit 1
          fi
          
          # Verificar build.gradle.kts raíz
          if [ -f "build.gradle.kts" ]; then
            echo "✅ build.gradle.kts"
          else
            echo "❌ ERROR: build.gradle.kts no encontrado"
            exit 1
          fi
          
          # Verificar build.gradle.kts de app
          if [ -f "app/build.gradle.kts" ]; then
            echo "✅ app/build.gradle.kts"
          else
            echo "❌ ERROR: app/build.gradle.kts no encontrado"
            exit 1
          fi
          
          # Mostrar estructura
          echo ""
          echo "=== Estructura del proyecto ==="
          ls -la
          echo ""
          echo "=== Contenido de settings.gradle.kts ==="
          cat settings.gradle.kts
      
      - name: 🛠️ Preparar Gradle Wrapper
        run: |
          if [ -f "gradlew" ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            echo "✅ gradlew listo"
          else
            echo "Generando gradlew..."
            gradle wrapper --gradle-version 8.5 2>/dev/null || {
              echo "Descargando gradle-wrapper.jar..."
              mkdir -p gradle/wrapper
              wget -q "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -O gradle/wrapper/gradle-wrapper.jar
              
              echo "Creando gradle-wrapper.properties..."
              echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
              echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
              echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
              echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
              echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
              echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
              echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            }
          fi
      
      - name: 📦 Cache de dependencias
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: 🔨 Compilar APK Debug
        run: |
          echo "=== Iniciando compilación ==="
          ./gradlew assembleDebug --stacktrace --no-daemon --build-cache
          echo "=== Compilación completada ==="
        timeout-minutes: 30
      
      - name: 📊 Verificar APK generada
        run: |
          echo "=== Buscando APK generada ==="
          find app/build/outputs -name "*.apk" -type f
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_SIZE=$(stat -c%s "app/build/outputs/apk/debug/app-debug.apk" 2>/dev/null || echo "0")
            APK_SIZE_MB=$(echo "scale=2; $APK_SIZE/1048576" | bc 2>/dev/null || echo "0")
            echo "✅ APK Debug: ${APK_SIZE_MB}MB"
          else
            echo "⚠️  APK no encontrada"
          fi
      
      - name: 📤 Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: 🎉 Compilación exitosa
        if: success()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║  ✅ THUNDERAI COMPILADA CORRECTAMENTE  ║"
          echo "╠════════════════════════════════════════╣"
          echo "║  📱 Versión: 1.0.0                     ║"
          echo "║  📦 Build: Debug                       ║"
          echo "║  🏷️  Run: #${{ github.run_number }}                         ║"
          echo "╚════════════════════════════════════════╝"