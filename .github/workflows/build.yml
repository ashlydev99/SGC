name: Compilar APK ThunderAI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'
      
      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true
      
      - name: Instalar dependencias del sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build make
      
      - name: Configurar NDK 25 (compatible con armeabi-v7a)
        run: |
          sdkmanager "ndk;25.2.9519653" 2>/dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
      
      - name: Crear estructura de directorios
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          mkdir -p app/src/main/java/cu/thunder/ai/llama
          mkdir -p app/src/main/cpp
      
      - name: Crear wrapper Java para llama.cpp
        run: |
          echo 'package cu.thunder.ai.llama;' > app/src/main/java/cu/thunder/ai/llama/LlamaNative.java
          echo '' >> app/src/main/java/cu/thunder/ai/llama/LlamaNative.java
          echo 'public class LlamaNative {' >> app/src/main/java/cu/thunder/ai/llama/LlamaNative.java
          echo '    static { System.loadLibrary("llama"); }' >> app/src/main/java/cu/thunder/ai/llama/LlamaNative.java
          echo '    public static native long loadModel(String modelPath);' >> app/src/main/java/cu/thunder/ai/llama/LlamaNative.java
          echo '    public static native void freeModel(long modelPtr);' >> app/src/main/java/cu/thunder/ai/llama/LlamaNative.java
          echo '    public static native String generate(long modelPtr, String prompt, float temperature, int maxTokens);' >> app/src/main/java/cu/thunder/ai/llama/LlamaNative.java
          echo '    public static native boolean isModelLoaded(long modelPtr);' >> app/src/main/java/cu/thunder/ai/llama/LlamaNative.java
          echo '}' >> app/src/main/java/cu/thunder/ai/llama/LlamaNative.java
      
      - name: Crear implementacion JNI
        run: |
          echo '#include <jni.h>' > app/src/main/cpp/llama_jni.cpp
          echo '#include <string>' >> app/src/main/cpp/llama_jni.cpp
          echo '#include <vector>' >> app/src/main/cpp/llama_jni.cpp
          echo '#include "llama.h"' >> app/src/main/cpp/llama_jni.cpp
          echo 'struct LlamaContext { llama_model* model; llama_context* ctx; bool is_loaded; };' >> app/src/main/cpp/llama_jni.cpp
          echo 'extern "C" JNIEXPORT jlong JNICALL Java_cu_thunder_ai_llama_LlamaNative_loadModel(JNIEnv* env, jclass c, jstring p) {' >> app/src/main/cpp/llama_jni.cpp
          echo '  const char* path = env->GetStringUTFChars(p, 0);' >> app/src/main/cpp/llama_jni.cpp
          echo '  llama_backend_init();' >> app/src/main/cpp/llama_jni.cpp
          echo '  llama_model_params mp = llama_model_default_params();' >> app/src/main/cpp/llama_jni.cpp
          echo '  llama_model* m = llama_load_model_from_file(path, mp);' >> app/src/main/cpp/llama_jni.cpp
          echo '  if(!m){ env->ReleaseStringUTFChars(p,path); return 0; }' >> app/src/main/cpp/llama_jni.cpp
          echo '  llama_context_params cp = llama_context_default_params();' >> app/src/main/cpp/llama_jni.cpp
          echo '  cp.n_ctx=2048; cp.n_threads=4;' >> app/src/main/cpp/llama_jni.cpp
          echo '  llama_context* ctx = llama_new_context_with_model(m, cp);' >> app/src/main/cpp/llama_jni.cpp
          echo '  if(!ctx){ llama_free_model(m); env->ReleaseStringUTFChars(p,path); return 0; }' >> app/src/main/cpp/llama_jni.cpp
          echo '  env->ReleaseStringUTFChars(p,path);' >> app/src/main/cpp/llama_jni.cpp
          echo '  return reinterpret_cast<jlong>(new LlamaContext{m,ctx,true});' >> app/src/main/cpp/llama_jni.cpp
          echo '}' >> app/src/main/cpp/llama_jni.cpp
      
      - name: Clonar llama.cpp
        run: git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
      
      - name: Compilar para armeabi-v7a
        run: |
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          ABI="armeabi-v7a"
          TARGET="armv7a-linux-androideabi26"
          BUILD_DIR="/tmp/llama.cpp/build_$ABI"
          
          mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          
          cmake /tmp/llama.cpp \
            -G "Unix Makefiles" \
            -DCMAKE_MAKE_PROGRAM=make \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_ARM_NEON=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_FLAGS="-mfloat-abi=softfp -mfpu=neon" \
            -DCMAKE_CXX_FLAGS="-mfloat-abi=softfp -mfpu=neon"
          
          make llama -j$(nproc) 2>&1 | tail -5
          
          $TOOLCHAIN/bin/$TARGET-clang++ \
            -std=c++17 -shared -fPIC -mfloat-abi=softfp -mfpu=neon \
            -I/tmp/llama.cpp \
            "$GITHUB_WORKSPACE/app/src/main/cpp/llama_jni.cpp" \
            "$BUILD_DIR/libllama.a" \
            "$BUILD_DIR/ggml/src/libggml.a" \
            "$BUILD_DIR/ggml/src/libggml-base.a" \
            "$BUILD_DIR/ggml/src/libggml-cpu.a" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libllama.so" \
            -llog -landroid -lm
          
          ls -lh "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libllama.so"
          cd "$GITHUB_WORKSPACE"
      
      - name: Compilar para arm64-v8a
        run: |
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          ABI="arm64-v8a"
          TARGET="aarch64-linux-android26"
          BUILD_DIR="/tmp/llama.cpp/build_$ABI"
          
          mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          
          cmake /tmp/llama.cpp \
            -G "Unix Makefiles" \
            -DCMAKE_MAKE_PROGRAM=make \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-26 \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF
          
          make llama -j$(nproc) 2>&1 | tail -5
          
          $TOOLCHAIN/bin/$TARGET-clang++ \
            -std=c++17 -shared -fPIC \
            -I/tmp/llama.cpp \
            "$GITHUB_WORKSPACE/app/src/main/cpp/llama_jni.cpp" \
            "$BUILD_DIR/libllama.a" \
            "$BUILD_DIR/ggml/src/libggml.a" \
            "$BUILD_DIR/ggml/src/libggml-base.a" \
            "$BUILD_DIR/ggml/src/libggml-cpu.a" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libllama.so" \
            -llog -landroid -lm
          
          ls -lh "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libllama.so"
          cd "$GITHUB_WORKSPACE"
      
      - name: Instalar Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH
      
      - name: Crear archivos de configuracion
        run: |
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
          echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
          echo 'rootProject.name = "ThunderAI"' >> settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts
          echo 'plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.20" apply false; id("com.google.devtools.ksp") version "1.9.20-1.0.14" apply false }' > build.gradle.kts
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties
          echo 'kotlin.code.style=official' >> gradle.properties
          echo 'android.nonTransitiveRClass=true' >> gradle.properties
          echo 'sdk.dir=/usr/local/lib/android/sdk' > local.properties
      
      - name: Compilar APK Debug
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          gradle assembleDebug --no-daemon --stacktrace --build-cache -Dorg.gradle.jvmargs="-Xmx2048m"
        timeout-minutes: 45
      
      - name: Verificar APK
        run: find . -name "*.apk" -type f -exec ls -lh {} \;
      
      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Subir librerias nativas
        uses: actions/upload-artifact@v4
        with:
          name: llama-libs
          path: app/src/main/jniLibs/**/*.so
          retention-days: 7
      
      - name: Subir logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: app/build/reports/
          retention-days: 7