name: Compilar APK ThunderAI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'
      
      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true
      
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
      
      - name: Configurar NDK
        run: |
          echo "Configurando NDK..."
          sdkmanager "ndk;26.1.10909125" 2>/dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK: $ANDROID_HOME/ndk/26.1.10909125"
      
      - name: Crear estructura de directorios
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64
          mkdir -p app/src/main/java/cu/thunder/ai/llama
          mkdir -p app/src/main/cpp
          echo "Directorios creados"
      
      - name: Crear wrapper Java para llama.cpp
        run: |
          cat > app/src/main/java/cu/thunder/ai/llama/LlamaNative.java << 'JAVAEOF'
package cu.thunder.ai.llama;

public class LlamaNative {
    static {
        System.loadLibrary("llama");
    }
    
    public static native long loadModel(String modelPath);
    public static native void freeModel(long modelPtr);
    public static native String generate(long modelPtr, String prompt, 
                                           float temperature, int maxTokens);
    public static native boolean isModelLoaded(long modelPtr);
}
JAVAEOF
          echo "Wrapper Java creado"
      
      - name: Crear implementacion JNI (C++)
        run: |
          cat > app/src/main/cpp/llama_jni.cpp << 'CPPEOF'
#include <jni.h>
#include <string>
#include <cstring>
#include <vector>
#include "llama.h"

struct LlamaContext {
    llama_model* model;
    llama_context* ctx;
    bool is_loaded;
};

extern "C"
JNIEXPORT jlong JNICALL
Java_cu_thunder_ai_llama_LlamaNative_loadModel(
    JNIEnv* env, jclass clazz, jstring modelPath) {
    
    const char* path = env->GetStringUTFChars(modelPath, nullptr);
    
    llama_backend_init();
    
    llama_model_params model_params = llama_model_default_params();
    model_params.n_gpu_layers = 0;
    
    llama_model* model = llama_load_model_from_file(path, model_params);
    
    if (!model) {
        env->ReleaseStringUTFChars(modelPath, path);
        return 0;
    }
    
    llama_context_params ctx_params = llama_context_default_params();
    ctx_params.n_ctx = 2048;
    ctx_params.n_batch = 512;
    ctx_params.n_threads = 4;
    ctx_params.n_threads_batch = 4;
    
    llama_context* ctx = llama_new_context_with_model(model, ctx_params);
    
    if (!ctx) {
        llama_free_model(model);
        env->ReleaseStringUTFChars(modelPath, path);
        return 0;
    }
    
    LlamaContext* llamaCtx = new LlamaContext();
    llamaCtx->model = model;
    llamaCtx->ctx = ctx;
    llamaCtx->is_loaded = true;
    
    env->ReleaseStringUTFChars(modelPath, path);
    return reinterpret_cast<jlong>(llamaCtx);
}

extern "C"
JNIEXPORT void JNICALL
Java_cu_thunder_ai_llama_LlamaNative_freeModel(
    JNIEnv* env, jclass clazz, jlong modelPtr) {
    
    if (modelPtr == 0) return;
    LlamaContext* llamaCtx = reinterpret_cast<LlamaContext*>(modelPtr);
    if (llamaCtx->ctx) llama_free(llamaCtx->ctx);
    if (llamaCtx->model) llama_free_model(llamaCtx->model);
    llama_backend_free();
    delete llamaCtx;
}

extern "C"
JNIEXPORT jboolean JNICALL
Java_cu_thunder_ai_llama_LlamaNative_isModelLoaded(
    JNIEnv* env, jclass clazz, jlong modelPtr) {
    
    if (modelPtr == 0) return JNI_FALSE;
    LlamaContext* llamaCtx = reinterpret_cast<LlamaContext*>(modelPtr);
    return llamaCtx->is_loaded ? JNI_TRUE : JNI_FALSE;
}

extern "C"
JNIEXPORT jstring JNICALL
Java_cu_thunder_ai_llama_LlamaNative_generate(
    JNIEnv* env, jclass clazz, jlong modelPtr,
    jstring prompt, jfloat temperature, jint maxTokens) {
    
    if (modelPtr == 0) {
        return env->NewStringUTF("Error: Modelo no cargado");
    }
    
    LlamaContext* llamaCtx = reinterpret_cast<LlamaContext*>(modelPtr);
    const char* promptStr = env->GetStringUTFChars(prompt, nullptr);
    
    std::vector<llama_token> tokens(llama_n_ctx(llamaCtx->ctx));
    int n_tokens = llama_tokenize(
        llamaCtx->model, promptStr, strlen(promptStr),
        tokens.data(), tokens.size(), true, false
    );
    
    if (n_tokens < 0) {
        tokens.resize(-n_tokens);
        n_tokens = llama_tokenize(
            llamaCtx->model, promptStr, strlen(promptStr),
            tokens.data(), tokens.size(), true, false
        );
    }
    tokens.resize(n_tokens);
    
    std::string response;
    
    for (int i = 0; i < maxTokens; i++) {
        if (llama_eval(llamaCtx->ctx, tokens.data(), tokens.size(), 
                       i == 0 ? 0 : tokens.size() - 1, 4) != 0) {
            break;
        }
        
        auto logits = llama_get_logits(llamaCtx->ctx);
        auto n_vocab = llama_n_vocab(llamaCtx->model);
        
        std::vector<llama_token_data> candidates;
        candidates.reserve(n_vocab);
        
        for (llama_token token_id = 0; token_id < n_vocab; token_id++) {
            candidates.push_back({token_id, logits[token_id], 0.0f});
        }
        
        llama_token_data_array candidates_p = {
            candidates.data(), candidates.size(), false
        };
        
        llama_sample_temp(llamaCtx->ctx, &candidates_p, temperature);
        llama_sample_top_k(llamaCtx->ctx, &candidates_p, 40, 1);
        llama_sample_top_p(llamaCtx->ctx, &candidates_p, 0.95f, 1);
        
        llama_token new_token = llama_sample_token(llamaCtx->ctx, &candidates_p);
        
        if (new_token == llama_token_eos(llamaCtx->model)) break;
        
        char buf[32];
        int n = llama_token_to_piece(llamaCtx->model, new_token, buf, sizeof(buf), 0, true);
        if (n < 0) break;
        response.append(buf, n);
        
        tokens = {new_token};
    }
    
    env->ReleaseStringUTFChars(prompt, promptStr);
    return env->NewStringUTF(response.c_str());
}
CPPEOF
          echo "Implementacion JNI creada"
      
      - name: Clonar llama.cpp
        run: |
          echo "Clonando llama.cpp..."
          git clone --depth 1 --branch b4464 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
          echo "llama.cpp clonado"
      
      - name: Compilar llama.cpp + JNI para Android
        run: |
          echo "=== COMPILANDO LLAMA.CPP + JNI ==="
          
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          
          declare -A ABIS
          ABIS[arm64-v8a]="aarch64-linux-android26"
          ABIS[armeabi-v7a]="armv7a-linux-androideabi26"
          ABIS[x86_64]="x86_64-linux-android26"
          
          for ABI in "${!ABIS[@]}"; do
            TARGET="${ABIS[$ABI]}"
            echo ""
            echo "========================================="
            echo "Compilando para $ABI (target: $TARGET)"
            echo "========================================="
            
            BUILD_DIR="/tmp/llama.cpp/build_$ABI"
            mkdir -p "$BUILD_DIR"
            cd "$BUILD_DIR"
            
            # Compilar llama.cpp como libreria estatica
            cmake /tmp/llama.cpp \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_SERVER=OFF \
              -DLLAMA_CURL=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF
            
            cmake --build . --config Release --target llama -j$(nproc)
            
            # Compilar el JNI y linkear con llama.cpp
            echo "Compilando JNI wrapper para $ABI..."
            
            $TOOLCHAIN/bin/$TARGET-clang++ \
              -std=c++17 \
              -shared \
              -fPIC \
              -I/tmp/llama.cpp \
              -I/tmp/llama.cpp/common \
              -I/tmp/llama.cpp/ggml/include \
              -I/tmp/llama.cpp/build_$ABI/ggml/include \
              "$GITHUB_WORKSPACE/app/src/main/cpp/llama_jni.cpp" \
              -L"$BUILD_DIR" \
              -L"$BUILD_DIR/ggml" \
              -llama \
              -lggml \
              -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libllama.so" \
              -llog \
              -landroid
            
            if [ -f "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libllama.so" ]; then
              SIZE=$(stat -c%s "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libllama.so")
              echo "✅ libllama.so generado para $ABI ($(($SIZE/1048576))MB)"
            else
              echo "❌ Fallo compilacion para $ABI"
              # Intentar metodo alternativo
              echo "Intentando metodo alternativo..."
              $TOOLCHAIN/bin/$TARGET-clang++ \
                -std=c++17 -shared -fPIC \
                -I/tmp/llama.cpp \
                "$GITHUB_WORKSPACE/app/src/main/cpp/llama_jni.cpp" \
                "$BUILD_DIR"/libllama.a \
                "$BUILD_DIR"/ggml/src/libggml.a \
                -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libllama.so" \
                -llog -landroid -lm
              
              if [ -f "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libllama.so" ]; then
                echo "✅ libllama.so generado (metodo alternativo)"
              fi
            fi
            
            cd "$GITHUB_WORKSPACE"
          done
          
          echo ""
          echo "=== ARCHIVOS .SO GENERADOS ==="
          find app/src/main/jniLibs -name "*.so" -type f -exec ls -lh {} \;
      
      - name: Instalar Gradle 8.5
        run: |
          echo "Instalando Gradle 8.5..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH
          gradle --version
      
      - name: Crear archivos de configuracion
        run: |
          echo "Creando archivos de configuracion..."
          
          echo "pluginManagement {" > settings.gradle.kts
          echo "    repositories {" >> settings.gradle.kts
          echo "        google()" >> settings.gradle.kts
          echo "        mavenCentral()" >> settings.gradle.kts
          echo "        gradlePluginPortal()" >> settings.gradle.kts
          echo "    }" >> settings.gradle.kts
          echo "}" >> settings.gradle.kts
          echo "" >> settings.gradle.kts
          echo "dependencyResolutionManagement {" >> settings.gradle.kts
          echo "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)" >> settings.gradle.kts
          echo "    repositories {" >> settings.gradle.kts
          echo "        google()" >> settings.gradle.kts
          echo "        mavenCentral()" >> settings.gradle.kts
          echo "    }" >> settings.gradle.kts
          echo "}" >> settings.gradle.kts
          echo "" >> settings.gradle.kts
          echo "rootProject.name = \"ThunderAI\"" >> settings.gradle.kts
          echo "include(\":app\")" >> settings.gradle.kts
          
          echo "plugins {" > build.gradle.kts
          echo "    id(\"com.android.application\") version \"8.2.0\" apply false" >> build.gradle.kts
          echo "    id(\"org.jetbrains.kotlin.android\") version \"1.9.20\" apply false" >> build.gradle.kts
          echo "    id(\"com.google.devtools.ksp\") version \"1.9.20-1.0.14\" apply false" >> build.gradle.kts
          echo "}" >> build.gradle.kts
          
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          
          ls -la *.gradle* *.properties
      
      - name: Compilar APK Debug
        run: |
          echo "=== COMPILANDO APK ==="
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx2048m"
          
          echo "=== COMPILACION TERMINADA ==="
        timeout-minutes: 45
      
      - name: Verificar APK
        run: |
          echo "=== BUSCANDO APK ==="
          find . -name "*.apk" -type f
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            echo ""
            echo "=== CONTENIDO DE LA APK (.so) ==="
            unzip -l app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | grep "\.so" || echo "No .so encontrados"
          fi
      
      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Subir librerias nativas
        uses: actions/upload-artifact@v4
        with:
          name: llama-libs
          path: app/src/main/jniLibs/**/*.so
          retention-days: 7
      
      - name: Subir logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
          retention-days: 7