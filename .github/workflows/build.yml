name: Compilar APK ThunderAI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'
      
      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true
      
      - name: REGENERAR TODOS LOS ARCHIVOS DE CONFIGURACION
        run: |
          echo "=========================================="
          echo "REGENERANDO ARCHIVOS DE CONFIGURACION"
          echo "=========================================="
          
          # 1. Crear settings.gradle.kts
          echo ""
          echo "Creando settings.gradle.kts..."
          cat > settings.gradle.kts << 'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "ThunderAI"
include(":app")
EOF
          echo "✅ settings.gradle.kts creado"
          
          # 2. Crear build.gradle.kts (raíz)
          echo ""
          echo "Creando build.gradle.kts..."
          cat > build.gradle.kts << 'EOF'
plugins {
    id("com.android.application") version "8.2.0" apply false
    id("org.jetbrains.kotlin.android") version "1.9.20" apply false
    id("com.google.devtools.ksp") version "1.9.20-1.0.14" apply false
}
EOF
          echo "✅ build.gradle.kts creado"
          
          # 3. Crear gradle.properties
          echo ""
          echo "Creando gradle.properties..."
          cat > gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
EOF
          echo "✅ gradle.properties creado"
          
          # 4. Crear local.properties
          echo ""
          echo "Creando local.properties..."
          cat > local.properties << 'EOF'
sdk.dir=/usr/local/lib/android/sdk
EOF
          echo "✅ local.properties creado"
          
          # 5. Crear gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "Creando gradle-wrapper.properties..."
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          echo "✅ gradle-wrapper.properties creado"
          
          # 6. Descargar gradle-wrapper.jar
          echo ""
          echo "Descargando gradle-wrapper.jar..."
          wget -q "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" \
            -O gradle/wrapper/gradle-wrapper.jar
          echo "✅ gradle-wrapper.jar descargado"
          
          # 7. Crear gradlew si no existe o corregirlo
          echo ""
          echo "Configurando gradlew..."
          if [ -f "gradlew" ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            echo "✅ gradlew corregido"
          else
            cat > gradlew << 'GRADLEWEOF'
#!/bin/sh
SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
CLASSPATH="$SCRIPT_DIR/gradle/wrapper/gradle-wrapper.jar"
exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
GRADLEWEOF
            chmod +x gradlew
            echo "✅ gradlew creado"
          fi
          
          # 8. Eliminar archivos problemáticos si existen
          rm -f .gradle/config.properties 2>/dev/null
          rm -rf .gradle/daemon 2>/dev/null
          
          # 9. Mostrar resumen
          echo ""
          echo "=========================================="
          echo "ARCHIVOS GENERADOS:"
          echo "=========================================="
          echo ""
          echo "--- Raíz del proyecto ---"
          ls -la settings.gradle.kts build.gradle.kts gradle.properties local.properties gradlew 2>/dev/null
          echo ""
          echo "--- gradle/wrapper ---"
          ls -la gradle/wrapper/
          echo ""
          echo "--- Contenido de settings.gradle.kts ---"
          cat settings.gradle.kts
          echo ""
          echo "=========================================="
          echo "CONFIGURACION COMPLETADA"
          echo "=========================================="
      
      - name: Cache de Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Compilar APK Debug
        run: |
          echo "=========================================="
          echo "INICIANDO COMPILACION"
          echo "=========================================="
          echo ""
          echo "Directorio actual: $(pwd)"
          echo ""
          echo "Archivos en raiz:"
          ls -la *.gradle* *.properties gradlew 2>/dev/null
          echo ""
          echo "Ejecutando Gradle..."
          
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx2048m" \
            -Dandroid.sdk.path="/usr/local/lib/android/sdk"
          
          echo ""
          echo "=========================================="
          echo "COMPILACION FINALIZADA"
          echo "=========================================="
        timeout-minutes: 30
      
      - name: Verificar APK
        run: |
          echo "=== Buscando APK ==="
          find . -name "*.apk" -type f 2>/dev/null
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            echo ""
            echo "✅ APK DEBUG GENERADA CORRECTAMENTE"
          else
            echo ""
            echo "⚠️ APK no encontrada en ruta esperada"
            find . -name "*.apk" -type f
          fi
      
      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: Subir APK Release (si existe)
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Subir logs (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            .gradle/
          retention-days: 7