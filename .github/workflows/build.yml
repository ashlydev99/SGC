name: Compilar APK ThunderAI

on:
  workflow_dispatch:  # Ejecución manual desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Clonar el repositorio
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2. Configurar Java 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # 3. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'
      
      # 4. Aceptar licencias de Android
      - name: Aceptar licencias de Android
        run: |
          yes | sdkmanager --licenses || true
      
      # 5. CORREGIR PERMISOS Y FORMATEO DE GRADLEW
      - name: Corregir permisos de gradlew
        run: |
          echo "=== Verificando gradlew ==="
          
          # Verificar que existe
          if [ -f "gradlew" ]; then
            echo "✅ gradlew encontrado"
          else
            echo "❌ gradlew NO encontrado"
            exit 1
          fi
          
          # Eliminar retornos de carro de Windows (\r)
          echo "Eliminando retornos de carro..."
          sed -i 's/\r$//' gradlew
          
          # Dar permisos de ejecución
          echo "Dando permisos de ejecución..."
          chmod +x gradlew
          
          # Verificar permisos
          if [ -x "gradlew" ]; then
            echo "✅ gradlew es ejecutable"
          else
            echo "❌ Error: gradlew no es ejecutable"
            ls -la gradlew
            exit 1
          fi
          
          # Verificar gradle-wrapper.jar
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ gradle-wrapper.jar encontrado"
          else
            echo "⚠️ gradle-wrapper.jar NO encontrado, descargando..."
            mkdir -p gradle/wrapper
            wget -q "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" \
              -O gradle/wrapper/gradle-wrapper.jar
            echo "✅ gradle-wrapper.jar descargado"
          fi
          
          # Verificar gradle-wrapper.properties
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "✅ gradle-wrapper.properties encontrado"
          else
            echo "⚠️ gradle-wrapper.properties NO encontrado, creando..."
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
            echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "✅ gradle-wrapper.properties creado"
          fi
          
          echo ""
          echo "=== Archivos listos ==="
          ls -la gradlew gradle/wrapper/
      
      # 6. Cache de Gradle
      - name: Cache de Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      # 7. Compilar APK Debug
      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      
      # 8. Compilar APK Release (opcional)
      - name: Compilar APK Release
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        continue-on-error: true
      
      # 9. Subir APK Debug
      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      # 10. Subir APK Release
      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      # 11. Subir logs
      - name: Subir logs de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: app/build/reports/
          retention-days: 7