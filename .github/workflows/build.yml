name: Compilar APK ThunderAI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
      
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'
      
      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true
      
      - name: Instalar Gradle 8.5
        run: |
          echo "Instalando Gradle 8.5..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH
          gradle --version
      
      - name: Crear archivos de configuracion
        run: |
          echo "Creando archivos de configuracion..."
          
          echo "pluginManagement {" > settings.gradle.kts
          echo "    repositories {" >> settings.gradle.kts
          echo "        google()" >> settings.gradle.kts
          echo "        mavenCentral()" >> settings.gradle.kts
          echo "        gradlePluginPortal()" >> settings.gradle.kts
          echo "    }" >> settings.gradle.kts
          echo "}" >> settings.gradle.kts
          echo "" >> settings.gradle.kts
          echo "dependencyResolutionManagement {" >> settings.gradle.kts
          echo "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)" >> settings.gradle.kts
          echo "    repositories {" >> settings.gradle.kts
          echo "        google()" >> settings.gradle.kts
          echo "        mavenCentral()" >> settings.gradle.kts
          echo "    }" >> settings.gradle.kts
          echo "}" >> settings.gradle.kts
          echo "" >> settings.gradle.kts
          echo "rootProject.name = \"ThunderAI\"" >> settings.gradle.kts
          echo "include(\":app\")" >> settings.gradle.kts
          
          echo "plugins {" > build.gradle.kts
          echo "    id(\"com.android.application\") version \"8.2.0\" apply false" >> build.gradle.kts
          echo "    id(\"org.jetbrains.kotlin.android\") version \"1.9.20\" apply false" >> build.gradle.kts
          echo "    id(\"com.google.devtools.ksp\") version \"1.9.20-1.0.14\" apply false" >> build.gradle.kts
          echo "}" >> build.gradle.kts
          
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          
          echo "Archivos creados:"
          ls -la *.gradle* *.properties
      
      - name: Compilar APK Debug
        run: |
          echo "=== COMPILANDO ==="
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx2048m"
          
          echo "=== COMPILACION TERMINADA ==="
        timeout-minutes: 30
      
      - name: Verificar APK
        run: |
          echo "=== BUSCANDO APK ==="
          find . -name "*.apk" -type f
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            echo "APK DEBUG GENERADA CORRECTAMENTE"
          fi
      
      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAI-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Subir logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: app/build/reports/
          retention-days: 7